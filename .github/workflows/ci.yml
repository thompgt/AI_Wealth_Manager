name: CI

# The suite already ran offline against a temp database -- tests/conftest.py
# points the engine at a throwaway SQLite file and stubs every network and LLM
# call -- so there was nothing standing between "these tests exist" and "these
# tests run on every push" except this file.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A second push to the same branch makes the first run's answer irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # No secrets are needed and none are referenced: a run that quietly depended
  # on a key would pass for maintainers and fail for every contributor.
  # Agents drop to their deterministic fallbacks when the key is a placeholder,
  # which is a path worth exercising anyway.
  ENVIRONMENT: development
  GEMINI_API_KEY: DUMMY_API_KEY
  LLM_MAX_ATTEMPTS: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wealthmanager_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Single version on purpose. The dependency set is pinned to exact
          # versions precisely so every install resolves identically, and this
          # is the interpreter the pins were verified against.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Dependency security audit
        # Scans pinned packages against the Python Packaging Advisory Database.
        run: pip-audit -r requirements.txt --desc on

      - name: Postgres migrations apply from empty
        # Runs Alembic against a real PostgreSQL instance to verify native DDL
        # and type compatibility that SQLite cannot catch.
        env:
          NEON_DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/wealthmanager_ci
        run: alembic upgrade head

      - name: Postgres migrations match the models
        # `alembic check` autogenerates against the migrated PostgreSQL schema
        # and fails if any model changes are missing from migration files.
        env:
          NEON_DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/wealthmanager_ci
        run: alembic check

      - name: Postgres migrations reverse to base
        # Validates that rollback DDL executes cleanly without foreign key
        # locks or table drop failures under real PostgreSQL semantics.
        env:
          NEON_DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/wealthmanager_ci
        run: alembic downgrade base

      - name: Postgres migrations re-apply to head
        env:
          NEON_DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/wealthmanager_ci
        run: alembic upgrade head

      - name: Tests with coverage floor enforcement
        # Runs the full test suite and enforces a minimum 65% code coverage gate
        # across all core agent, service, server, and model modules.
        run: pytest --cov=agents --cov=services --cov=server --cov=db --cov-report=term --cov-report=xml --cov-fail-under=65
