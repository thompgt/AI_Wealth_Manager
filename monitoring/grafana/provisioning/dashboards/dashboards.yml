# Loads every dashboard JSON in /var/lib/grafana/dashboards (mounted from
# monitoring/grafana/dashboards) at startup, so the dashboard lives in git rather
# than only in Grafana's database.
apiVersion: 1

providers:
  - name: wealth-dashboards
    orgId: 1
    folder: AI Wealth Manager
    type: file
    disableDeletion: false
    # Picks up edits to the JSON files without restarting the container.
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
