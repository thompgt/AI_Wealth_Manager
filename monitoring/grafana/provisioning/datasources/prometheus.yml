# Provisioned at startup so Grafana comes up already pointed at Prometheus.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: wealth-prometheus
    type: prometheus
    access: proxy
    # Service name on the Compose network, and Prometheus' in-container port —
    # not the 9093 the host sees.
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Must match prometheus.yml's scrape_interval, or Grafana's $__rate_interval
      # computes rate() windows too small to contain two samples and panels read
      # as empty.
      timeInterval: 5s
