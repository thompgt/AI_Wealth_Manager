[project]
name = "ai-wealth-manager"
version = "2.0.0"
description = "Multi-agent portfolio analysis, wealth management, and deterministic guardrails"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "fastapi==0.139.0",
    "uvicorn==0.51.0",
    "httpx==0.28.1",
    "langgraph==1.2.9",
    "langgraph-checkpoint-sqlite==3.1.0",
    "langchain-core==1.4.9",
    "langchain-google-genai==4.2.7",
    "sqlalchemy==2.0.51",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "alembic==1.18.5",
    "email-validator==2.3.0",
    "google-cloud-bigquery==3.45.0",
    "bcrypt==5.0.0",
    "pyjwt==2.12.1",
    "prometheus-client==0.24.1",
    "numpy==2.5.1",
    "pandas==3.0.3",
    "yfinance==1.5.1",
    "ddgs==9.14.4",
    "requests==2.34.2",
    "python-dotenv==1.2.2",
    "solara==1.60.3",
    "plotly==6.9.0",
    "anywidget==0.11.0",
    "mlflow>=2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.14.6",
]
notebook = [
    "jupyterlab>=4.0.0",
    "kaleido>=0.2.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=9.0",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
# Discovery was resting entirely on tests/conftest.py inserting the repo root
# into sys.path, which works when pytest is invoked from the repo root and
# nowhere else -- so a CI job, a container entrypoint or an editor's test
# runner could each fail to import the package for a different reason.
# `pythonpath` states it instead.
#
# conftest.py still sets the environment (a temp database, a dummy key)
# because that must happen before db.py builds its engine at import time,
# which is earlier than any fixture can run.
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
# Fail on an unraisable exception rather than printing it and moving on -- a
# background thread dying in the job worker should not look like a pass.
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:httpx.*",
]

[tool.ruff]
line-length = 100
# The demo notebook is prose-first: its imports deliberately follow the
# narration rather than sitting in one block at the top.
extend-exclude = ["demo.ipynb", ".venv", "alembic/versions"]

# Rule selection is left at ruff's default (pyflakes plus the pycodestyle
# errors that catch real bugs). Turning on the import-sorting or full
# pycodestyle sets would flag a hundred pre-existing style points across the
# tree, which is a reformatting project rather than a lint gate, and a CI
# check nobody can pass on day one is a check that gets disabled.
